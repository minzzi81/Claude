# 수집 목표
targets:
  posts: 600
  comments: 5000

# 소스별 게시물 수집 상한 (합이 targets.posts 이상이면 됨)
source_post_caps:
  naver_blog: 300
  naver_cafe: 100
  naver_news: 50
  youtube: 100
  instagram: 0      # 분석 범위에서 제외 (타인 게시물 댓글 수집 불가). --sources instagram 으로만 실행

# 관련성 필터: 본문/제목에 이 중 하나는 들어가야 함
relevance_terms: ["스마트싱스", "smartthings", "smart things", "스마트 싱스"]

queries:
  - 스마트싱스
  - 스마트싱스 후기
  - 스마트싱스 자동화
  - 스마트싱스 루틴
  - 스마트싱스 허브
  - 스마트싱스 스테이션
  - 스마트싱스 에어컨
  - 스마트싱스 냉장고
  - 스마트싱스 세탁기
  - 스마트싱스 로봇청소기
  - 스마트싱스 TV
  - 스마트싱스 조명
  - 스마트싱스 IoT
  - 삼성 스마트홈 스마트싱스
  - SmartThings 사용기

instagram_hashtags: [스마트싱스, smartthings, 스마트싱스자동화, 삼성스마트홈]

# 형태소 분석기가 쪼개는 복합명사 (예: 닭가슴살 -> 닭/가슴살). 특정 결론을 유도하지 않도록 도메인 일반 명사만 넣는다
user_words: [닭가슴살, 밀키트, 에어프라이어, 에어프라이, 전기요금, 원격제어, 미세먼지, 바디프로필]

# 제품 사전: 제품명 -> 소문자 본문에 적용할 정규식 패턴(일반 단어는 부분일치와 동일)
# 짧은 단어는 오탐 방지를 위해 lookaround 사용 (예: 패밀리허브 != 허브, 미러링 != 링)
products:
  큐커: ["큐커", "bespoke cooker", "비스포크 쿠커"]
  식기세척기: ["식기세척기", "식세기"]
  냉장고: ["냉장고", "패밀리허브", "family hub", "김치냉장고", "비스포크 냉장고"]
  세탁기_건조기: ["세탁기", "건조기", "그랑데", "에어드레서", "콤보"]
  에어컨: ["에어컨", "무풍", "윈드프리", "windfree"]
  TV: ["(?<![a-z])tv(?![a-z])", "티비", "네오qled", "qled", "oled", "더 프레임", "스마트모니터"]
  로봇청소기: ["로봇청소기", "제트봇", "jetbot", "비스포크 ai 스팀"]
  공기청정기: ["공기청정기", "블루스카이", "비스포크 큐브"]
  허브_스테이션: ["(?<!패밀리)(?<!패밀리 )허브", "스테이션", "station", "aeotec", "에이오텍"]
  조명_스위치: ["조명", "전구", "스위치", "hue", "필립스 휴", "벽스위치"]
  센서_플러그: ["센서", "멀티퍼포스", "모션센서", "플러그", "콘센트"]
  도어락_보안: ["도어락", "도어벨", "홈캠", "카메라", "cctv"]
  갤럭시_웨어러블: ["갤럭시워치", "갤럭시 워치", "버즈", "스마트태그", "smarttag", "갤럭시링"]
  스마트폰_앱: ["갤럭시폰", "갤럭시 ?s\\d", "아이폰", "(?<![가-힣])앱", "어플", "위젯"]

# ---------------- 큐커 중심 층화 수집 (python run_collect.py --design strata) ----------------
# 큐커 = 분석 대상, 나머지 = 비교군. 모든 층에 같은 포함 기준(스마트싱스 언급 + 해당 제품 언급)을 적용한다.
# 검색어는 "스마트싱스 + 제품명"까지만 넣는다. 다이어트·레시피 같은 맥락어를 넣으면 결론을 수집 단계에서 만들게 된다.
focus_product: 큐커
strata:
  큐커:          {quota: 200, queries: [스마트싱스 큐커, 비스포크 큐커 스마트싱스, 큐커 스마트싱스 연동, 큐커 스마트싱스 후기, 큐커 오븐 스마트싱스]}
  냉장고:        {quota: 50, queries: [스마트싱스 냉장고, 비스포크 냉장고 스마트싱스, 패밀리허브 스마트싱스]}
  세탁기_건조기: {quota: 50, queries: [스마트싱스 세탁기, 스마트싱스 건조기, 그랑데 스마트싱스]}
  에어컨:        {quota: 50, queries: [스마트싱스 에어컨, 무풍에어컨 스마트싱스]}
  TV:            {quota: 50, queries: [스마트싱스 TV, 삼성 TV 스마트싱스]}
  로봇청소기:    {quota: 50, queries: [스마트싱스 로봇청소기, 제트봇 스마트싱스]}
  식기세척기:    {quota: 50, queries: [스마트싱스 식기세척기, 비스포크 식기세척기 스마트싱스]}
  공기청정기:    {quota: 50, queries: [스마트싱스 공기청정기, 비스포크 큐브 스마트싱스]}
  조명_스위치:   {quota: 50, queries: [스마트싱스 조명, 스마트싱스 스위치, 스마트싱스 전구]}
